<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h2>MEU SITE</h2>
    </header>

    <main>

        <section class="hero">
            <h1>Bem-vindo ao meu site</h1>

            <p>
                Este é o meu primeiro site conectado a um sistema em Python.
            </p>
        </section>

        <section class="formulario">

            <h2>Entre em contato</h2>

            {% if sucesso %}
                <div class="sucesso">
                    ✅ Mensagem enviada com sucesso!
                </div>
            {% endif %}

            <form method="POST">

                <label>Seu nome</label>
                <input
                    type="text"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label>Telefone</label>
                <input
                    type="text"
                    name="telefone"
                    placeholder="+243..."
                    required
                >

                <label>Mensagem</label>
                <textarea
                    name="mensagem"
                    placeholder="Digite sua mensagem"
                    required
                ></textarea>

                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>

    </main>

</body>
</html>
